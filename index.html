<html>
    <head>
       <link rel="stylesheet" href="index.css">
       <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Smythe&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
        <h1>Jimmy's Diner</h1>
        <h2>The best burgers and pizzas in town</h2>
        </header>
        <main>
            <div class="container">
                <div class="menuout" id="menuout">
                <!-- menu -->
                </div>
                    <div id="orderdiv">
                        <div class="orderheader hidden" id="order">Your Order</div>
                        <div id="orderinfo">
                        <!-- order info -->
                        </div>
                        <div class="totalprice cart-menu-outter hidden" id="totalPrice"></div>
                        <button class="purchasebtn hidden" id="purchasebtn">Complete Order</button>
                    </div>
                </div>

        </main>
    <div class="modal" id="modal">
		<div class="close-modal-btn-container">
			<button class="modal-close-btn" id="modal-close-btn">X</button>
		</div>
		<div class="modal-inner" id="modal-inner">
			<h2>Enter 💳 Details (this for testing only)</h2>
			<p class="modal-text" id="modal-text"></p>
			<form id="consent-form">
				<input type="text" name="fullName" placeholder="Enter your full name" required/>
				<input type="text" name="cc-Number"minlength="19" maxlength="19" inputmode="numeric" pattern="[0-9]*"maxlength="19" placeholder="Enter your Card Number" required/>
                <input type="text" maxlength="3" minlength="3" inputmode="numeric" pattern="[0-9]*" name="cvvNumber" placeholder="Enter CVV" required/>
				<div class="modal-choice-btns" id="modal-choice-btns">
					<button type="submit" class="modal-btn">Pay</button>
				</div>

			</form>
		</div>
	</div>    
    <footer>
            
        </footer>
        <script type="module" src="index.js"></script>
    </body>
</html>
